[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "nobody"
version = "0.4.0"
description = "NOBODY — the filesystem-native semantic layer that makes any agent punch above its weight. No server, no database, just meaning, measured."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "NOBODY contributors" }]
keywords = ["agents", "semantic-layer", "context-engineering", "memory", "knowledge", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/nobody-agent/nobody"

[project.scripts]
nobody = "nobody.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
